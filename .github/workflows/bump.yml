name: bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Update ComfyUI release and custom node pins
        id: bump
        run: scripts/bump.sh | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          branch: bump/upstream
          delete-branch: true
          commit-message: "Bump ComfyUI to ${{ steps.bump.outputs.comfyui }} and custom node pins"
          title: "Bump ComfyUI to ${{ steps.bump.outputs.comfyui }} and custom node pins"
          body: Automated upstream bump. The bump workflow builds this branch, squash-merges on success, then dispatches the main build that publishes the image.

      - name: Build bump branch, merge on success, publish from main
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: |
          run_url=$(gh workflow run build.yml --ref bump/upstream)
          run_id=${run_url##*/}
          [[ $run_id =~ ^[0-9]+$ ]] || { echo "No run id in: $run_url"; exit 1; }
          for _ in {1..30}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" --silent && break
            sleep 5
          done
          gh run watch "$run_id" --exit-status
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch
          gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
