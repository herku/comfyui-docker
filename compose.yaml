services:
  comfyui:
    image: ghcr.io/herku/comfyui-api:latest
    build: .
    env_file:
      - path: comfyui.env
        required: false
    volumes:
      - comfyui-data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - comfyui
    restart: unless-stopped

volumes:
  comfyui-data:
